# Lab cluster used to validate q1.md - q16.md (see VALIDATION.md).
# A kubeadm cluster, so /etc/kubernetes/manifests, etcd and the kubelet config
# are all real — which is what the control-plane questions need.
#
#   kind create cluster --config kind.yaml
#   docker exec -it cks-control-plane bash
#   kind delete cluster --name cks
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cks
nodes:
- role: control-plane
- role: worker
